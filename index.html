<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Aizu Connectは、会津のイベントを探して申し込み、参加履歴を確認できるサービスです。"
    />
    <meta name="theme-color" content="#f5f8fb" />
    <meta name="robots" content="index,follow" />
    <link rel="canonical" href="https://aizu-connect-prod.web.app/" />
    <title>Aizu Connect | 会津のイベント情報</title>
  </head>
  <body>
    <div id="root">
      <main class="auth-shell initial-app-shell" aria-busy="true">
        <div class="auth-visual">
          <div class="auth-brand">
            <span class="brand-mark" aria-hidden="true">
              <svg viewBox="0 0 24 24" width="22" height="22" fill="none">
                <path
                  d="M7.5 19 12 5l4.5 14M9 14h6"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                ></path>
                <circle cx="12" cy="3.5" r="1.5" fill="currentColor"></circle>
              </svg>
            </span>
            <strong>Aizu Connect</strong>
          </div>
          <div>
            <h1>会津のイベント<br /><em>を探す。</em></h1>
            <p>
              学生・地域・団体が主催するイベントを、<br />探して、申し込んで、参加できます。
            </p>
          </div>
          <div class="auth-visual-note">参加した活動は記録として残ります</div>
        </div>
        <div class="auth-form-wrap">
          <div class="auth-form-card">
            <div class="auth-mobile-brand">
              <div class="auth-brand">
                <span class="brand-mark" aria-hidden="true">
                  <svg viewBox="0 0 24 24" width="22" height="22" fill="none">
                    <path
                      d="M7.5 19 12 5l4.5 14M9 14h6"
                      stroke="currentColor"
                      stroke-width="2"
                      stroke-linecap="round"
                      stroke-linejoin="round"
                    ></path>
                    <circle
                      cx="12"
                      cy="3.5"
                      r="1.5"
                      fill="currentColor"
                    ></circle>
                  </svg>
                </span>
                <strong>Aizu Connect</strong>
              </div>
            </div>
            <h2>アカウントを作成</h2>
            <p class="auth-lede" role="status">
              利用に必要な情報を準備しています。
            </p>
            <div class="initial-loading-lines" aria-hidden="true">
              <span></span><span></span><span></span>
            </div>
          </div>
        </div>
      </main>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
