<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>農作業モック</title>
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        color: #303030;
        font-family: Arial, "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
        background: #d7f8f7;
      }
      .page { min-height: 100vh; padding: 20px 16px 32px; }
      .device {
        width: min(100%, 430px); min-height: calc(100vh - 52px); margin: auto;
        filter: drop-shadow(0 16px 34px rgba(46, 117, 118, .10));
      }
      header { height: 48px; display: flex; align-items: flex-start; }
      .title-button, h2 {
        border: 1px solid #168f8c;
        border-radius: 13px;
        background: #53d0c9;
        color: #111;
      }
      .title-button {
        min-width: 70px; height: 38px; padding: 0 14px;
        font-size: 22px; font-weight: bold; cursor: pointer;
        transition: transform .18s ease, box-shadow .18s ease;
      }
      .title-button:hover { transform: translateY(-2px); box-shadow: 0 5px 10px rgba(22, 143, 140, .20); }
      .title-button:active { transform: translateY(0); }
      .panel {
        min-height: calc(100vh - 52px);
        border: 1px solid #27c9c3;
        border-radius: 9px;
        background: #d7f8f7;
        animation: panel-in .28s ease both;
      }
      .panel[hidden] { display: none; }
      @keyframes panel-in {
        from { opacity: 0; transform: translateY(10px); }
        to { opacity: 1; transform: translateY(0); }
      }
      .top-panel {
        padding: 108px 0 96px;
        display: flex; flex-direction: column; align-items: center; gap: 96px;
      }
      button { font-family: inherit; }
      .menu-card, .form-card, .form-title, .info-main, .info-grid div,
      .before-harvest, .size-list div {
        border: 2px solid #f0eeee;
        border-radius: 5px;
        background: #effcfc;
        color: #303030;
      }
      .menu-card {
        width: 230px; height: 86px; font-size: 29px; cursor: pointer;
        transition: transform .18s ease, box-shadow .18s ease, background .18s ease;
      }
      .menu-card:hover { transform: translateY(-4px); background: #f8ffff; box-shadow: 0 8px 14px rgba(58, 157, 156, .16); }
      .menu-card:active { transform: translateY(-1px); }
      .form-panel {
        padding: 116px 0 90px;
        display: flex; flex-direction: column; align-items: center; gap: 22px;
      }
      .form-title {
        width: 300px; min-height: 66px; padding: 19px 10px;
        margin-bottom: 72px; text-align: center; font-size: 20px; white-space: nowrap;
      }
      .form-card {
        width: 220px; height: 58px; font-size: 25px; font-weight: bold; cursor: pointer;
        transition: transform .18s ease, box-shadow .18s ease, background .18s ease;
      }
      .form-card:hover { transform: translateX(4px); background: #f8ffff; box-shadow: 0 6px 12px rgba(58, 157, 156, .14); }
      .form-card:active { transform: translateX(1px); }
      .selection-panel { padding: 108px 20px 82px; }
      .section-card {
        position: relative; padding: 46px 20px 20px;
        border: 1px solid #27c9c3; border-radius: 9px;
      }
      .section-card + .section-card { margin-top: 48px; }
      h2 {
        position: absolute; top: 10px; left: 12px; margin: 0;
        padding: 5px 12px; font-size: 22px; font-weight: normal;
      }
      .info-main { height: 70px; display: grid; place-items: center; font-size: 24px; font-weight: bold; }
      .info-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 2px; }
      .info-grid div { height: 72px; display: grid; place-items: center; font-size: 23px; font-weight: bold; }
      .size-card { padding: 80px 20px 20px; }
      .before-harvest {
        position: absolute; top: 22px; right: 20px; width: 176px; height: 52px;
        display: grid; place-items: center; font-size: 20px; font-weight: bold;
      }
      .size-list div {
        height: 58px; display: grid; grid-template-columns: 105px 1fr;
        align-items: center; padding: 0 12px; border-radius: 0; font-size: 25px;
      }
      .size-list div + div { border-top: 0; }
      button:focus-visible { outline: 3px solid rgba(22, 143, 140, .45); outline-offset: 3px; }
      @media (max-width: 380px) {
        .top-panel { gap: 62px; padding-top: 72px; }
        .form-title { width: calc(100% - 24px); font-size: 17px; }
        .selection-panel { padding-inline: 12px; }
        .before-harvest { width: 150px; font-size: 17px; }
      }
    </style>
  </head>
  <body>
    <div class="page">
      <div class="device">
        <header>
          <button class="title-button" id="page-title">TOP</button>
        </header>

        <main class="panel top-panel" id="top-screen">
          <button class="menu-card" type="button">ToDo</button>
          <button class="menu-card" data-screen="harvest">収穫</button>
          <button class="menu-card" data-screen="selection">選果</button>
          <button class="menu-card" type="button">追熟</button>
          <button class="menu-card" type="button">出荷</button>
        </main>

        <main class="panel form-panel" id="harvest-screen" hidden>
          <div class="form-title">dd/mm/yyyy_品種番地名_樹体名</div>
          <button class="form-card">番地名</button>
          <button class="form-card">樹体名</button>
          <button class="form-card">品種名</button>
          <button class="form-card">枝</button>
          <button class="form-card">収穫量</button>
          <button class="form-card">スタッフ名</button>
        </main>

        <main class="panel selection-panel" id="selection-screen" hidden>
          <section class="section-card">
            <h2>収穫情報</h2>
            <div class="info-main">収穫ID</div>
            <div class="info-grid"><div>収穫日</div><div>品種</div></div>
          </section>
          <section class="section-card size-card">
            <h2>サイズ数量</h2>
            <div class="before-harvest">選果前収穫量</div>
            <div class="size-list">
              <div><span>LL:</span><span>kg</span></div>
              <div><span>L:</span><span>kg</span></div>
              <div><span>M:</span><span>kg</span></div>
              <div><span>S:</span><span>kg</span></div>
              <div><span>ロス:</span><span>自動 kg</span></div>
            </div>
          </section>
        </main>
      </div>
    </div>
    <script src="mobile-mock.js"></script>
  </body>
</html>
